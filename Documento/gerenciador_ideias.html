<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Ideias - Instagram Verônica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #394233; margin-bottom: 20px; font-size: 24px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .topic-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; }
    .topic-item:hover { background: #fafafa; }
    .topic-item:last-child { border-bottom: none; }
    .topic-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: #bf9566; }
    .topic-item label { flex: 1; cursor: pointer; font-size: 16px; color: #333; }
    .topic-item.posted label { color: #888; text-decoration: line-through; }
    .topic-item .date { font-size: 12px; color: #999; }
    .btn { background: #bf9566; color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px; }
    .btn:hover { background: #a88455; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .status { padding: 12px; border-radius: 8px; margin-top: 16px; font-size: 14px; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Ideias para Carrosséis Instagram</h1>
    
    <div class="card">
      <div class="menu-bar" style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: space-between; align-items: center;">
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="batch-btn" onclick="batchReject()">🗑️ Rejeitar</button>
          <button class="batch-btn" onclick="batchReady()">✅ Pronto</button>
          <button class="batch-btn" onclick="batchReviewed()">👀 Revisado</button>
          <button class="batch-btn" onclick="batchPublish()">🚀 Publicar</button>
          <span style="border-left: 1px solid #ccc;"></span>
          <button class="batch-btn" onclick="selectAll()">☑️ Todos</button>
          <button class="batch-btn" onclick="deselectAll()">⬜ Limpar</button>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="batch-btn" style="background: #bf9566; color: #fff;" onclick="solicitarCarousel()">🎨 Solicitar Carrossel</button>
        </div>
      </div>
      <div class="filter-btns">
        <button class="filter-btn active" onclick="setFilter('todos')">Todos</button>
        <button class="filter-btn" onclick="setFilter('pendente')">Pendente</button>
        <button class="filter-btn" onclick="setFilter('pronto')">Pronto</button>
        <button class="filter-btn" onclick="setFilter('revisado')">Revisado</button>
        <button class="filter-btn" onclick="setFilter('publicado')">Publicado</button>
        <button class="filter-btn" onclick="setFilter('rejeitado')">Rejeitado</button>
      </div>
      <div id="topicsList"></div>
    </div>
    
    <div class="card" style="margin-top: 20px;">
      <h3 style="margin-bottom: 12px; color: #394233;">Gerenciar Tópicos</h3>
      <select id="rejectSelect" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 8px;">
        <option value="">Selecione um tópico para rejeitar...</option>
      </select>
      <button class="btn" style="background: #e74c3c; margin-top: 8px;" onclick="rejectTopic()">Rejeitar Tópico</button>
      
      <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
      <input type="text" id="newTopic" placeholder="Novo tópico..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 8px;">
      <button class="btn" style="background: #27ae60; margin-top: 8px;" onclick="addNewTopic()">Adicionar Novo Tópico</button>
    </div>
    
    <div id="status"></div>
  </div>

  <style>
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: auto; }
    .status-pendente { background: #ffeaa7; color: #d68910; }
    .status-pronto { background: #81ecec; color: #00b894; }
    .status-revisado { background: #74b9ff; color: #0984e3; }
    .status-publicado { background: #55efc4; color: #00b894; }
    .status-rejeitado { background: #ff7675; color: #c0392b; }
    .filter-btns { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; border: none; border-radius: 20px; font-size: 13px; cursor: pointer; background: #eee; color: #666; }
    .filter-btn.active { background: #bf9566; color: #fff; }
    .batch-btn { padding: 8px 12px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; background: #eee; color: #666; }
    .batch-btn:hover { background: #ddd; }
  </style>
<script>
    // Status: pendente, pronto, revisado, publicado
    // Carrega do arquivo JSON
    let topics = [];
    
    async function loadTopics() {
      try {
        const response = await fetch('ideias.json');
        topics = await response.json();
        render();
      } catch (e) {
        topics = [
          { id: 1, title: "Nutrição no tratamento oncológico", status: "pronto" },
          { id: 2, title: "Quimioterapia: o que comer", status: "pendente" },
          { id: 3, title: "Açúcar alimenta o tumor? MITO", status: "pendente" },
          { id: 4, title: "Graviola cura cáncer? MITO", status: "pendente" },
          { id: 5, title: "Dieta cetogênica funciona?", status: "pendente" },
          { id: 6, title: "Perda de massa magra - Sarcopenia", status: "pendente" },
          { id: 7, title: "Suplementação é segura?", status: "pendente" },
          { id: 8, title: "Nutrição pré-tratamento", status: "pendente" },
          { id: 9, title: "Mitos e verdades - Nutrição Oncológica", status: "pendente" },
          { id: 10, title: "Alimentação pós-tratamento", status: "pendente" },
        ];
        render();
      }
    }

    async function saveTopics() {
      const blob = new Blob([JSON.stringify(topics, null, 2)], {type: 'application/json'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'ideias.json';
      link.click();
    }

    let selectedTopics = [];
    let filter = 'todos';

    const statusLabels = {
      pendente: 'Pendente',
      pronto: 'Pronto',
      revisado: 'Revisado',
      publicado: 'Publicado',
      rejeitado: 'Rejeitado'
    };

    function render() {
      const list = document.getElementById('topicsList');
      const filtered = filter === 'todos' ? topics : topics.filter(t => t.status === filter);
      
      list.innerHTML = filtered.map(t => `
        <div class="topic-item ${t.status === 'publicado' ? 'posted' : ''}" onclick="event.stopPropagation(); toggleSelect(${t.id})">
          <input type="checkbox" ${selectedTopics.includes(t.id) ? 'checked' : ''} ${t.status === 'publicado' ? 'disabled' : ''}>
          <label>${t.title}</label>
          <span class="status-badge status-${t.status}">${statusLabels[t.status]}</span>
          ${t.date ? `<span class="date">${t.date}</span>` : ''}
        </div>
      `).join('');
      
      // Popula select de rejeitar
      const rejectSelect = document.getElementById('rejectSelect');
      const pendingTopics = topics.filter(t => t.status === 'pendente');
      rejectSelect.innerHTML = '<option value="">Selecione um tópico para rejeitar...</option>' + 
        pendingTopics.map(t => `<option value="${t.id}">${t.title}</option>`).join('');
    }

    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function toggleSelect(id) {
      const topic = topics.find(t => t.id === id);
      if (topic.status === 'publicado') return;
      
      if (selectedTopics.includes(id)) {
        selectedTopics = selectedTopics.filter(t => t !== id);
      } else {
        selectedTopics.push(id);
      }
      console.log('selectedTopics:', selectedTopics);
      render();
    }

    function selectAll() {
      const filtered = filter === 'todos' ? topics : topics.filter(t => t.status === filter);
      selectedTopics = filtered.filter(t => t.status !== 'publicado').map(t => t.id);
      render();
    }

    function deselectAll() {
      selectedTopics = [];
      render();
    }

    function batchReject() {
      console.log('batchReject chamado, selectedTopics:', selectedTopics);
      console.log('length:', selectedTopics.length);
      if (selectedTopics.length === 0) {
        showStatus('Selecione pelo menos um tópico', 'error');
        return;
      }
      selectedTopics.forEach(id => {
        const topic = topics.find(t => t.id === id);
        if (topic) topic.status = 'rejeitado';
      });
      showStatus(`✓ ${selectedTopics.length} tópico(s) rejeitado(s)`, 'success');
      saveTopics();
      selectedTopics = [];
      render();
    }

    function batchReady() {
      if (selectedTopics.length === 0) {
        showStatus('Selecione pelo menos um tópico', 'error');
        return;
      }
      selectedTopics.forEach(id => {
        const topic = topics.find(t => t.id === id);
        if (topic && topic.status === 'pendente') topic.status = 'pronto';
      });
      showStatus(`${selectedTopics.length} tópico(s) marcado(s) como Pronto`, 'success');
      saveTopics();
      selectedTopics = [];
      render();
    }

    function batchReviewed() {
      if (selectedTopics.length === 0) {
        showStatus('Selecione pelo menos um tópico', 'error');
        return;
      }
      let count = 0;
      selectedTopics.forEach(id => {
        const topic = topics.find(t => t.id === id);
        if (topic && topic.status === 'pronto') {
          topic.status = 'revisado';
          count++;
        }
      });
      if (count > 0) {
        showStatus(`${count} tópico(s) marcado(s) como Revisado`, 'success');
        saveTopics();
      } else {
        showStatus('Selecione tópico(s) "Pronto" para revisar', 'error');
      }
      selectedTopics = [];
      render();
    }

    function batchPublish() {
      if (selectedTopics.length === 0) {
        showStatus('Selecione pelo menos um tópico', 'error');
        return;
      }
      let count = 0;
      selectedTopics.forEach(id => {
        const topic = topics.find(t => t.id === id);
        if (topic && topic.status === 'revisado') {
          topic.status = 'publicado';
          topic.date = new Date().toLocaleDateString('pt-BR');
          count++;
        }
      });
      if (count > 0) {
        showStatus(`${count} tópico(s) publicado(s)!`, 'success');
        saveTopics();
      } else {
        showStatus('Selecione tópico(s) "Revisado" para publicar', 'error');
      }
      selectedTopics = [];
      render();
    }

    function solicitarCarousel() {
      if (selectedTopics.length === 0) {
        showStatus('Selecione pelo menos um tópico', 'error');
        return;
      }
      const titles = selectedTopics.map(id => {
        const t = topics.find(top => top.id === id);
        return t ? t.title : null;
      }).filter(Boolean);
      
      if (titles.length > 0) {
        // Marca como Pronto para criação do carousel
        selectedTopics.forEach(id => {
          const topic = topics.find(t => t.id === id);
          if (topic && topic.status === 'pendente') {
            topic.status = 'pronto';
          }
        });
        saveTopics();
        
        // Mostra os tópicos selecionados e instrui como pedir
        const topicList = titles.map((t, i) => `${i+1}. ${t}`).join('\n');
        alert(`Tópicos marcados como PRONTO para criar carrossel:\n\n${topicList}\n\n👉 Agora é só pedir no chat: "criar carousel para [tema]" que eu gero os slides!`);
        
        showStatus(`✓ ${titles.length} tópico(s) marcado(s) como Pronto!`, 'success');
      }
      selectedTopics = [];
      render();
    }

    function showStatus(msg, type) {
      document.getElementById('status').innerHTML = `<div class="status ${type}">${msg}</div>`;
    }

    function setFilter(f) {
      filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function markReviewed() {
      if (selectedTopics.length === 0) {
        showStatus('Selecione pelo menos um tópico', 'error');
        return;
      }
      let count = 0;
      selectedTopics.forEach(id => {
        const topic = topics.find(t => t.id === id);
        if (topic && topic.status === 'pronto') {
          topic.status = 'revisado';
          count++;
        }
      });
      if (count > 0) {
        showStatus(`${count} tópico(s) marcado(s) como Revisado`, 'success');
        saveTopics();
      } else {
        showStatus('Selecione tópico(s) "Pronto" para revisar', 'error');
      }
      selectedTopics = [];
      render();
    }

    function createCarousel() {
      if (selectedTopics.length === 0) return;
      const topic = topics.find(t => t.id === selectedTopics[0]);
      if (topic) {
        topic.status = 'publicado';
        topic.date = new Date().toLocaleDateString('pt-BR');
        saveTopics();
        
        selectedTopics = [];
        render();
        showStatus('✓ Marcado como publicado!', 'success');
      }
    }

    function rejectTopic() {
      const select = document.getElementById('rejectSelect');
      const topicId = parseInt(select.value);
      if (!topicId) {
        showStatus('Selecione um tópico para rejeitar', 'error');
        return;
      }
      const topic = topics.find(t => t.id === topicId);
      if (topic) {
        topic.status = 'rejeitado';
        saveTopics();
        showStatus(`✓ Tópico "${topic.title}" rejeitado`, 'error');
      }
    }

    function addNewTopic() {
      const input = document.getElementById('newTopic');
      const title = input.value.trim();
      if (!title) {
        showStatus('Digite o título do novo tópico', 'error');
        return;
      }
      const newId = Math.max(...topics.map(t => t.id)) + 1;
      topics.push({ id: newId, title: title, status: 'pendente' });
      saveTopics();
      
      input.value = '';
      render();
      showStatus(`✓ Novo tópico adicionado! "${title}"`, 'success');
    }

    loadTopics();
  </script>
</body>
</html>
